# Builds the one-container image (Dockerfile) on GitHub, tests it — SQL Server starts, the database is set up, the API
# answers, the React app is served and admin can log in — and pushes it to Docker Hub as <DOCKERHUB_USERNAME>/ramas-erp.
# No Docker is needed on the PC. Set up once in GitHub → repo Settings → Secrets and variables → Actions:
#   variable DOCKERHUB_USERNAME   the Docker Hub user name (the job is skipped while it is not set)
#   secret   DOCKERHUB_TOKEN      a Docker Hub personal access token with Read & Write
# Create the repository "ramas-erp" on hub.docker.com as PRIVATE first: the image contains the application's code.
name: Docker Hub

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-hub
  cancel-in-progress: true

jobs:
  image:
    if: ${{ vars.DOCKERHUB_USERNAME != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/ramas-erp
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ramas-erp:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test the container
        run: |
          docker run -d --name ramas-ci -p 8080:4000 \
            -e MSSQL_SA_PASSWORD="Sa-$(openssl rand -hex 10)-Q7" \
            -e DB_PASSWORD="App-$(openssl rand -hex 10)-Q7" \
            -e DB_NAME=ramas -e DB_USER=ramas_app \
            -e JWT_SECRET="$(openssl rand -hex 32)" \
            ramas-erp:test
          up=0
          for i in $(seq 1 72); do
            if curl -fsS http://localhost:8080/api/health > /dev/null 2>&1; then up=1; break; fi
            [ "$(docker inspect -f '{{.State.Running}}' ramas-ci)" = "true" ] || break
            sleep 5
          done
          docker logs ramas-ci 2>&1 | grep -v '^\s*$' | tail -80
          [ "$up" = 1 ] || { echo "::error::The API did not come up (see the container log above)"; exit 1; }
          curl -fsS http://localhost:8080/ | grep -q 'id="root"'
          curl -fsS -X POST http://localhost:8080/api/auth/login -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"admin123","divCode":"DIV1001","financialYear":"2026-2027"}' | grep -q '"token"'
          echo "Container OK: database set up, API up, React app served, admin can log in"

      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
